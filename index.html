/* Brand: Livingston ISD green #0C482D and white, taken from the district site and logo. Pink is only for the Pink Out event chip.
   Layout: green band header, tab strip, one working column (max 1080px). Yellow-tinted boxes are the inputs, same rule as the old spreadsheet. */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --surface-2:#E2EBE6; --ink:#0F2219; --muted:#536A5E; --line:#CCDAD2;
  --band:#0C482D; --band-ink:#FFFFFF; --gold:#FFFFFF; --accent:#0C482D; --accent-ink:#FFFFFF; --focus:#2E8B57;
  --pink:#D23C74; --pink-soft:#FBE1EB; --input:#FFF7DC; --input-line:#E6CF85;
  --good:#1D7443; --good-soft:#DDF0E3; --warn:#9A5B00; --warn-soft:#FFEFCC; --bad:#B0233A; --bad-soft:#FBE2E6;
  --shadow:0 1px 2px rgba(19,36,26,.06),0 4px 14px rgba(19,36,26,.06);
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1510; --surface:#142019; --surface-2:#1B2A21; --ink:#E5EEE7; --muted:#97A99D; --line:#2A3B30;
  --band:#0A3A25; --band-ink:#F2F8F4; --gold:#F2F8F4; --accent:#74C69D; --accent-ink:#0A1A12; --focus:#74C69D;
  --pink:#F06A9C; --pink-soft:#3A1726; --input:#2A2714; --input-line:#5E5323;
  --good:#6CC891; --good-soft:#163323; --warn:#F0B24B; --warn-soft:#33270F; --bad:#F07A8C; --bad-soft:#3A161D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1510; --surface:#142019; --surface-2:#1B2A21; --ink:#E5EEE7; --muted:#97A99D; --line:#2A3B30;
  --band:#0A3A25; --band-ink:#F2F8F4; --gold:#F2F8F4; --accent:#74C69D; --accent-ink:#0A1A12; --focus:#74C69D;
  --pink:#F06A9C; --pink-soft:#3A1726; --input:#2A2714; --input-line:#5E5323;
  --good:#6CC891; --good-soft:#163323; --warn:#F0B24B; --warn-soft:#33270F; --bad:#F07A8C; --bad-soft:#3A161D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

.alldone{display:flex;align-items:center;gap:10px}
.pride{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:36px;color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.pride .paw{color:var(--accent);opacity:.7}
.pride .paw:nth-child(2){transform:rotate(15deg) translateY(-4px)}
.pride .paw:nth-child(4){transform:rotate(-15deg) translateY(-4px)}
.band .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:14px}
.band{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--band);z-index:6}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.brand svg{flex:none;width:42px;height:42px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:23px;letter-spacing:.02em;line-height:1.05;color:var(--gold);text-transform:uppercase}
#upBtn{background:#FFFFFF;color:#0C482D;border-color:#FFFFFF;font-weight:800}
.brand .logo{flex:none;height:60px;width:60px;background:#FFFFFF;border-radius:50%;padding:5px;object-fit:contain;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
@media (max-width:520px){.brand .logo{height:50px;width:50px}.brand h1{font-size:20px}}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85;letter-spacing:.02em}
.chip-event{display:inline-flex;align-items:center;gap:8px;background:var(--event,var(--pink));color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.chip-event .dot{width:8px;height:8px;border-radius:50%;background:#fff}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{font-size:12px;opacity:.85}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.in:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.band .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:var(--band-ink)}
.band .btn.on{background:#FFFFFF;color:#0C482D;border-color:#FFFFFF}
/* tabs */
.tabbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--event,var(--pink));color:#fff;font-size:11px;line-height:18px;text-align:center}
.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13.5px;border:1px solid var(--input-line)}
.notice b{color:var(--warn)}
main{padding-block:18px 120px}
section+section{margin-top:22px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:18px;font-weight:800}
.sec-h p{margin:0;color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.profit{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.profit .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.equation{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:14px;font-size:14px}
.equation .term{display:flex;flex-direction:column;background:var(--surface-2);border-radius:10px;padding:7px 11px}
.equation .term b{font-size:16px}
.equation .term span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.equation .op{font-weight:800;color:var(--muted);font-size:18px}
.foot{color:var(--muted);font-size:12.5px;margin-top:12px}
.event{padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.event::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--event,var(--pink))}
.event-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.announce{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;margin-bottom:16px;background:var(--surface);border:2px solid var(--event,var(--pink));box-shadow:var(--shadow);font-size:15.5px;font-weight:600;white-space:pre-line}
.announce .paw{color:var(--event,var(--pink));font-size:22px;margin-top:1px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 6px;cursor:pointer;font-weight:600;font-size:13px}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches i{width:18px;height:18px;border-radius:50%;display:block}
.swatches input:checked+i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
textarea.in{min-height:84px;resize:vertical;font:inherit}
.event h3{font-size:16px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-size:20px;font-weight:800}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--event,var(--pink));border-radius:99px}
/* needs */
.needs{display:grid;gap:8px}
.need{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.need:hover{border-color:var(--accent)}
.need .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.need .tx{flex:1;min-width:0}
.need .tx small{display:block;color:var(--muted);font-size:12.5px}
.need .go{color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.alldone{padding:14px;border-radius:12px;background:var(--good-soft);color:var(--good);font-weight:600}
/* pills */
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.new{background:var(--pink-soft);color:var(--pink);background:color-mix(in srgb,var(--event,var(--pink)) 15%,var(--surface));color:color-mix(in srgb,var(--event,var(--pink)) 75%,var(--ink))}
.pill.restock{background:var(--warn-soft);color:var(--warn)}
.pill.donated{background:var(--good-soft);color:var(--good)}
.pill.out{background:var(--bad);color:#fff}
.pill.low{background:var(--warn-soft);color:var(--warn)}
/* inputs */
.in{background:var(--input);border:1px solid var(--input-line);border-radius:9px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.in.numin{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.in.dirty{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-soft);border-color:var(--event,var(--pink));box-shadow:0 0 0 2px color-mix(in srgb,var(--event,var(--pink)) 22%,transparent)}
.in.empty{border-style:dashed}
.ro{display:inline-block}
.blank{color:var(--muted)}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:4px;align-items:center}
.stepper button{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:18px;cursor:pointer}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* item rows */
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 170px 120px;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item .nm{font-weight:700;min-width:0}
.item .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.item .cell span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.item .cell b{font-size:16px}
.item .res{text-align:right}
.item-head{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 170px 120px;gap:12px;padding:0 14px 2px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.item-head .r{text-align:right}
@media (max-width:760px){
  .item-head{display:none}
  .item{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .item .nm{grid-column:1/-1}
  .item .entry{grid-column:1/-1;order:5}
  .item .res{text-align:left}
}
.item.details{grid-template-columns:minmax(0,2fr) 130px 100px 100px minmax(0,1.4fr) auto}
@media (max-width:760px){.item.details{grid-template-columns:repeat(2,minmax(0,1fr))}.item.details .wide{grid-column:1/-1}}
.lbl{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:14px;margin-top:12px}
/* list rows (money etc) */
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:120px minmax(0,1.3fr) 150px minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row .when{color:var(--muted);font-size:13px}
.row .what{font-weight:700;min-width:0}
.row .note{color:var(--muted);font-size:13px;min-width:0}
.row .amt{text-align:right;font-weight:700}
.row.need-it{border-color:var(--input-line);background:linear-gradient(0deg,var(--surface),var(--surface))}
@media (max-width:760px){.row{grid-template-columns:minmax(0,1fr) 140px}.row .when{grid-column:1/-1;order:-1}.row .note{grid-column:1/-1}.row .act{grid-column:1/-1}}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800;font-size:16px}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.results>div{padding:16px;border-right:1px solid var(--line)}
.results>div:last-child{border-right:0}
.results span{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.results b{font-size:22px}
@media (max-width:620px){.results{grid-template-columns:1fr}.results>div{border-right:0;border-bottom:1px solid var(--line)}.results>div:last-child{border-bottom:0}}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
/* cash */
.cashgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.cashgrid{grid-template-columns:1fr}}
.form{display:grid;gap:12px}
.calc{display:grid;gap:0}
.calc div{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.calc div:last-child{border-bottom:0}
.calc .final{font-size:20px;font-weight:800}
/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--surface-2)}
td .in{min-height:36px;padding:6px 8px}
/* activity */
.log{display:grid;gap:0}
.log .ent{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.log .ent:last-child{border-bottom:0}
.log .t{color:var(--muted);font-size:12.5px}
@media (max-width:620px){.log .ent{grid-template-columns:minmax(0,1fr) auto}.log .t{grid-column:1/-1}}
/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.savebar .msg{flex:1;min-width:0;font-weight:600}
.savebar .btn{border-color:transparent}
.savebar .btn.primary{background:var(--event,var(--pink));color:#fff}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,8,.55);z-index:30;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:6px}
.sheet p{color:var(--muted);margin:0 0 14px}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet ul{margin:0 0 6px;padding-left:18px}
.err{color:var(--bad);font-weight:600;font-size:13.5px;min-height:1em}
.sheet.wide{max-width:920px}
.drop{position:relative;border:2px dashed var(--input-line);background:var(--input);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);font-weight:600}
.drop.over{border-color:var(--accent)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs figure{margin:0;position:relative}
.thumbs img{height:76px;width:auto;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-weight:800;cursor:pointer;line-height:1}
details.paste summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:12px}
.imp-head{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.imp-line{display:grid;grid-template-columns:26px minmax(0,2.2fr) 74px 96px 86px;gap:8px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.imp-line.off{opacity:.45}
.imp-line .lbl{display:none}
.imp-line .title{font-size:12.5px;color:var(--muted);margin-top:4px}
.imp-line .newfields{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;margin-top:8px}
.imp-line input[type=checkbox]{width:20px;height:20px;margin-top:10px}
.imp-cols{display:grid;grid-template-columns:26px minmax(0,2.2fr) 74px 96px 86px;gap:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.imp-sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 0;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px}
.tag.match{background:var(--good-soft);color:var(--good)}.tag.new{background:var(--pink-soft);color:var(--pink);background:color-mix(in srgb,var(--event,var(--pink)) 15%,var(--surface));color:color-mix(in srgb,var(--event,var(--pink)) 75%,var(--ink))}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.cnt-line{display:grid;grid-template-columns:34px minmax(0,2fr) 92px 92px 64px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cnt-line.unclear{background:var(--warn-soft);border-radius:8px;padding-left:6px;padding-right:6px}
.cnt-line .n{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

<script>
/* ===================== SETUP: paste your Google Apps Script web app URL between the quotes ===================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwORpIThnoPJntCgH1o4iIoo9PLhBB6PBw-zlhSF5p6D1EhEx8qEPellQ5F6OB2Tajx/exec';
/* Logo: the Livingston Lion mascot file sits next to index.html as lion.png. share.png is the link-preview image (1200 x 630).
   If the file is missing, the page shows the paw badge instead. */
const LOGO_URL = 'lion.png';
/* ============================================================================================================== */

/* ===== Shared rules: used by both the web page and the Google Apps Script backend ===== */
var SCHEMA = {
  items: { tab: 'Items', cols: [['id','ID'],['name','Item'],['category','Category'],['price','Sell Price'],['unitCost','Cost per Unit (if no order)'],['onHand','On Hand Before'],['countedAfter','Counted After'],['notes','Notes']] },
  purchases: { tab: 'Orders', cols: [['id','ID'],['date','Order Date'],['store','Store'],['item','Item'],['packs','Packs'],['packCost','Pack Cost'],['unitsPerPack','Units / Pack'],['source','Cost Source'],['sale','For Sale'],['notes','Notes']] },
  moneyIn: { tab: 'Money In', cols: [['id','ID'],['date','Date'],['event','Event'],['amount','Amount'],['notes','Notes']] },
  moneyOut: { tab: 'Money Out', cols: [['id','ID'],['date','Date'],['order','Order'],['amount','Amount'],['link','Auto'],['notes','Notes']] },
  sales: { tab: 'Sale History', cols: [['id','ID'],['date','Sale Date'],['theme','Theme'],['spent','Spent on Store Items'],['sales','Spirit Store Sales'],['other','Other Fundraising'],['what','What it was'],['link','Auto']] },
  cash: { tab: 'Cash Count', cols: [['id','ID'],['label','Line'],['value','Value']] },
  settings: { tab: 'Settings', cols: [['id','Setting'],['value','Value']] },
  log: { tab: 'Change Log', cols: [['time','Time'],['name','Who'],['role','Role'],['table','Section'],['rowId','Row'],['field','Field'],['old','Old Value'],['new','New Value']] }
};
var NUMERIC = {
  items: ['price','unitCost','onHand','countedAfter'],
  purchases: ['packs','packCost','unitsPerPack'],
  moneyIn: ['amount'], moneyOut: ['amount'],
  sales: ['spent','sales','other']
};
/* What a volunteer PIN may change. The admin PIN may change everything. */
var VOLUNTEER_CAN = {
  items: ['onHand','countedAfter','notes'],
  moneyIn: ['amount','notes'],
  cash: ['value']
};
var CASH_NUMERIC_IDS = ['start','end','cashapp'];
var NONNEGATIVE = ['price','unitCost','onHand','countedAfter','packs','packCost','unitsPerPack'];

function fieldsOf(table) { return SCHEMA[table].cols.map(function (c) { return c[0]; }); }
function isNumeric(table, field, id) {
  if (table === 'cash' && field === 'value') return CASH_NUMERIC_IDS.indexOf(String(id)) >= 0;
  if (table === 'settings' && field === 'value') return String(id) === 'startCash';
  return (NUMERIC[table] || []).indexOf(field) >= 0;
}
function cleanVal(table, field, v, id) {
  if (v === null || v === undefined) return '';
  if (isNumeric(table, field, id)) {
    var s = String(v).replace(/[$,\s]/g, '');
    if (s === '') return '';
    if (/^\(.*\)$/.test(s)) s = '-' + s.slice(1, -1);
    var n = Number(s);
    if (!isFinite(n)) return '';
    if (n < 0 && NONNEGATIVE.indexOf(field) >= 0) return '';
    return n;
  }
  return String(v).trim();
}
function normVal(table, field, v, id) {
  var c = cleanVal(table, field, v, id);
  if (c === '') return '';
  if (typeof c === 'number') return String(Math.round(c * 10000) / 10000);
  return c;
}
function canDo(role, op) {
  if (role === 'admin') return true;
  if (role !== 'volunteer') return false;
  // the upload screen's remembered answers live in one settings row that volunteers may update
  if (op.table === 'settings' && (op.op === 'set' ? (op.id === 'learned' && op.field === 'value') : (op.op === 'add' && op.row && op.row.id === 'learned'))) return true;
  return op.op === 'set' && (VOLUNTEER_CAN[op.table] || []).indexOf(op.field) >= 0;
}
function labelOf(table, row) {
  if (!row) return '';
  var k = { items: 'name', purchases: 'item', moneyIn: 'event', moneyOut: 'order', sales: 'theme', cash: 'label', settings: 'id' }[table];
  return String(row[k] || row.id || '');
}
/* Apply a batch of edits to in-memory tables. Each "set" carries the value the editor started from (prev);
   if someone else changed that value in the meantime, the edit is held back as a conflict instead of overwriting. */
function applyOps(t, ops, role, who, nowIso, atomic) {
  if (atomic) {
    // all or nothing: dry-run on a copy first, apply only if every edit is clean
    var trial = applyOps(JSON.parse(JSON.stringify(t)), ops, role, who, nowIso, false);
    if (trial.conflicts.length) return { applied: 0, conflicts: trial.conflicts, log: [], rejected: true };
  }
  var res = { applied: 0, conflicts: [], log: [] };
  for (var i = 0; i < ops.length; i++) {
    var op = ops[i];
    if (!op || !SCHEMA[op.table] || op.table === 'log' || !t[op.table]) { res.conflicts.push({ op: op, reason: 'unknown section' }); continue; }
    if (!canDo(role, op)) { res.conflicts.push({ op: op, reason: 'not allowed with this PIN' }); continue; }
    var table = t[op.table], fields = fieldsOf(op.table);
    if (op.op === 'set') {
      if (fields.indexOf(op.field) < 0 || op.field === 'id') { res.conflicts.push({ op: op, reason: 'unknown field' }); continue; }
      var row = null;
      for (var j = 0; j < table.length; j++) if (String(table[j].id) === String(op.id)) { row = table[j]; break; }
      if (!row) { res.conflicts.push({ op: op, reason: 'row was removed' }); continue; }
      var cur = normVal(op.table, op.field, row[op.field], op.id);
      var nv = cleanVal(op.table, op.field, op.value, op.id);
      if (cur === normVal(op.table, op.field, nv, op.id)) continue;
      if (cur !== normVal(op.table, op.field, op.prev, op.id)) { res.conflicts.push({ op: op, reason: 'changed', current: row[op.field] }); continue; }
      res.log.push({ time: nowIso, name: who, role: role, table: op.table, rowId: String(op.id), field: op.field, old: row[op.field] === undefined ? '' : String(row[op.field]), 'new': String(nv) });
      row[op.field] = nv; res.applied++;
    } else if (op.op === 'add') {
      var src = op.row || {}, nr = {};
      for (var f = 0; f < fields.length; f++) nr[fields[f]] = cleanVal(op.table, fields[f], src[fields[f]], src.id);
      if (!nr.id) nr.id = op.table.slice(0, 2) + Date.now().toString(36) + Math.floor(Math.random() * 1e4);
      var dup = false;
      for (var k = 0; k < table.length; k++) if (String(table[k].id) === String(nr.id)) dup = true;
      if (dup) { res.conflicts.push({ op: op, reason: 'duplicate' }); continue; }
      table.push(nr);
      res.log.push({ time: nowIso, name: who, role: role, table: op.table, rowId: String(nr.id), field: '(added)', old: '', 'new': labelOf(op.table, nr) });
      res.applied++;
    } else if (op.op === 'del') {
      var idx = -1;

function model(){
  const ev = setting('eventName');

  const allP = rows('purchases').map(p => {

  });
  const cur = allP.filter(p => p.current);
  const byItem = {};
  for (const p of cur) { const k = String(p.item||'').trim().toLowerCase(); if (!k) continue; byItem[k] = byItem[k] || { units:0, cost:0 }; byItem[k].units += p.units; byItem[k].cost += p.total; }

    const b = byItem[String(i.name||'').trim().toLowerCase()];

    const unitCost = b && b.units ? b.cost / b.units : num(i.unitCost);
    const onHandBlank = blank(i.onHand), onHand = num(i.onHand), avail = onHand + received;
    const counted = blank(i.countedAfter) ? null : num(i.countedAfter);
    const sold = counted === null ? 0 : Math.max(avail - counted, 0);
    const rev = sold * num(i.price), cos = sold * unitCost;
    const flag = counted === null ? '' : counted === 0 ? 'SOLD OUT' : counted <= 10 ? 'Low' : '';
    T.onHand += onHand; T.received += received; T.avail += avail; T.sold += sold; T.rev += rev; T.cos += cos; T.profit += rev - cos;
    T.shelfAll += unitCost * avail;

  });

  const taken = endBlank ? null : end - start;

    (deposit && Math.abs(num(deposit.amount) - end) < 0.01 && Math.abs(off + start) < Math.abs(off)) || Math.abs(off + start) < 5)));

    const live = s.link === 'current';

function logEntry(e){

    return `<div class="ent"><span class="t num">${esc(ftime(e.time))}</span><span><b>${esc(e.name || 'Someone')}</b> ${e.table === 'photos' ? (e.new === 'no photo' ? 'removed the photo for ' : e.new === 'starter photo' ? 'went back to the starter photo for ' : 'added a photo for ') + '<b>' + esc(it ? it.name : e.rowId) + '</b>' : 'changed the price sheet'} <span class="muted">· Price sheet</span></span></div>`;
  }
  const tname = { items:'Count', purchases:'Orders', moneyIn:'Money in', moneyOut:'Money out', sales:'History', cash:'Cash box', settings:'Settings' }[e.table] || e.table;
  const live = (data[e.table] || []).find(r => String(r.id) === String(e.rowId));
  const what = e.field === '(security)' ? esc(e.new) : e.field === '(added)' ? 'added <b>' + esc(e.new) + '</b>' : e.field === '(removed)' ? 'removed <b>' + esc(e.old) + '</b>' :
    'set <b>' + esc(FIELD_NAMES[e.field] || e.field) + '</b>' + (live ? ' for <b>' + esc(labelOf(e.table, live)) + '</b>' : '') + ' from ' + (blank(e.old) ? 'blank' : '<b>' + esc(e.old) + '</b>') + ' to ' + (blank(e.new) ? 'blank' : '<b>' + esc(e.new) + '</b>');
  const canRevert = isAdmin() && e.field && e.field[0] !== '(' && live && normVal(e.table, e.field, live[e.field], e.rowId) === normVal(e.table, e.field, e.new, e.rowId);
  return `<div class="ent"><span class="t num">${esc(ftime(e.time))}</span><span><b>${esc(e.name || 'Someone')}</b> ${what} <span class="muted">· ${esc(tname)}</span></span>${canRevert ? `<button class="btn small" type="button" data-revert='${esc(JSON.stringify({ t:e.table, id:e.rowId, f:e.field, old:e.old, nw:e.new }))}'>Undo</button>` : '<span></span>'}</div>`;
}

const TIERS = [[10,'Spirit wear & extras'],[4,'$5 & $4'],[3,'$3 items'],[2,'$2 items'],[1,'$1 items'],[0,'Under $1']];
function priceLabel(p){ p = num(p); return p < 1 && p > 0 ? Math.round(p*100) + '¢' : '$' + (Number.isInteger(p) ? p : p.toFixed(2)); }
function sheetRows(M, hideZero, next){
  const groups = TIERS.map(t => ({ label: t[1], min: t[0], items: [] }));
  for (const i of M.items) {
    const g = groups.find(g => num(i.price) >= g.min) || groups[groups.length - 1];
    let unknown, before, note;
    if (next) { // what's left now: the after-sale count, or what should be there if it wasn't counted
      const left = i.counted !== null ? i.counted : (i.onHandBlank && !i.received ? null : i.avail);
      unknown = left === null; before = unknown ? '' : left;
      note = [unknown ? 'COUNT BEFORE OPENING' : '', i.counted === null && !unknown && i.avail > 0 ? 'NOT COUNTED AFTER LAST SALE' : '', i.notes || ''].filter(Boolean).join(' · ');
    } else {
      unknown = i.onHandBlank && !i.received; before = unknown ? '' : i.avail;
      note = [unknown ? 'COUNT BEFORE OPENING' : '', i.received ? 'new: +' + i.received : '', i.notes || ''].filter(Boolean).join(' · ');
    }
    g.items.push({ id: i.id, name: i.name, price: priceLabel(i.price), before, note, hide: hideZero && !unknown && num(before) === 0 });
  }
  let n = 0; // numbered before hiding, so a row number always means the same item
  for (const g of groups) { g.items.sort((a, b) => String(a.name).localeCompare(String(b.name))); for (const it of g.items) it.n = ++n; g.items = g.items.filter(it => !it.hide); }
  return groups.filter(g => g.items.length);
}

/* ---------- Price sheet ----------
   Built from the tracker's items and prices, so it is always current. How each item shows (the name customers see,
   its group, special price text, hidden or not) is kept in the "priceSheet" setting; until an admin changes it, the
   starter layout that ships with the site (price-sheet.json, made from Brittany's sheet) is used. Items with the same
   name and price in the same group print as one box. Photos: a saved photo (Photos tab) wins over the starter photo. */
let psStarter = null, psSaved = null, psPending = {}, psTarget = '', psCfgDraft = null;
async function psLoad(){
  if (!psStarter) {
    try { const r = await fetch('price-sheet.json?b=' + BUILD); psStarter = r.ok ? await r.json() : { groups: [], items: [], photos: {} }; }
    catch (e) { psStarter = { groups: [], items: [], photos: {} }; }
  }
  if (!DEMO) {
    try { const r = await (await fetch(API_URL + '?action=photos' + (viewCode ? '&code=' + encodeURIComponent(viewCode) : '') + '&t=' + Date.now())).json(); if (r.ok) psSaved = r.photos || {}; }
    catch (e) { if (!psSaved) psSaved = {}; }
  } else psSaved = psSaved || {};
}
function psConfig(){
  let c = null; try { c = JSON.parse(setting('priceSheet') || 'null'); } catch (e) {}
  if (!c || !Array.isArray(c.i)) c = { g: (psStarter && psStarter.groups) || [], i: ((psStarter && psStarter.items) || []).map(x => [x[0], x[1], x[2], x[3] || '', 0]) };
  return c;
}
function psPhoto(id){
  if (psPending[id] !== undefined) return psPending[id] === 'none' ? '' : psPending[id] || (psStarter && psStarter.photos[id]) || '';
  const s = psSaved && psSaved[id];
  if (s === 'none') return '';
  return s || (psStarter && psStarter.photos[id]) || '';
}
/* the name a customer sees: no pack sizes, no price in the name */
function psCleanName(n){
  return String(n || '').replace(/\s*\((\d+\s*[- ]?\s*(pack|pairs?|sheets?|ct|count|pcs|pieces)|pair|all designs)\)\s*/ig, ' ').replace(/\s*\$\d+(\.\d+)?\s*$/, '').replace(/\s+/g, ' ').trim();
}
/* every item with its name, group and price text: saved choices first, sensible defaults for anything new */
function psRows(M, cfg){
  const byId = {}; cfg.i.forEach((x, k) => { byId[x[0]] = { k, name: x[1], group: x[2], ptext: x[3] || '', hide: !!x[4] }; });
  const groupOfPrice = {};
  for (const i of M.items) { const c = byId[i.id]; if (c && !c.hide) { const pk = String(num(i.price)); groupOfPrice[pk] = groupOfPrice[pk] || {}; groupOfPrice[pk][c.group] = (groupOfPrice[pk][c.group] || 0) + 1; } }
  return M.items.map((i, n) => {
    const c = byId[i.id], price = num(i.price);
    const guess = groupOfPrice[String(price)] ? Object.entries(groupOfPrice[String(price)]).sort((a, b) => b[1] - a[1])[0][0] : (price >= 10 ? 'Spirit wear & extras' : priceLabel(price));
    return { item: i, id: i.id, order: c ? c.k : 1000 + n, name: c ? c.name : psCleanName(i.name), group: c ? c.group : guess, ptext: c ? c.ptext : '', hide: c ? c.hide : false, price,
             inStock: (i.onHandBlank && !i.received) || i.avail > 0 };
  });
}
/* the boxes to print, grouped and in order */
function psCells(M, cfg, hideZero){
  const rows = psRows(M, cfg).filter(r => !r.hide && (r.price > 0 || r.ptext));
  const cells = {}, order = [];
  for (const r of rows.sort((a, b) => a.order - b.order || String(a.name).localeCompare(String(b.name)))) {
    const k = r.group + '|' + r.name.toLowerCase() + '|' + (r.ptext || r.price);
    if (!cells[k]) { cells[k] = { group: r.group, name: r.name, price: r.ptext || priceLabel(r.price), num: r.price, ids: [], inStock: false }; order.push(k); }
    cells[k].ids.push(r.id); cells[k].inStock = cells[k].inStock || r.inStock;
  }
  const groups = {};
  for (const k of order) { const c = cells[k]; if (hideZero && !c.inStock) continue; c.photo = c.ids.map(psPhoto).find(Boolean) || ''; (groups[c.group] = groups[c.group] || []).push(c); }
  const gi = g => { const x = cfg.g.indexOf(g); return x < 0 ? 999 : x; };
  return Object.keys(groups).map(g => ({ name: g, cells: groups[g], top: Math.max(...groups[g].map(c => c.num)) }))
    .sort((a, b) => b.top - a.top || gi(a.name) - gi(b.name) || a.name.localeCompare(b.name));
}

/* a picture from the phone: fit inside 200 x 200 on white, saved as a small JPEG */
function psResize(file){

    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {

}

/* ======================================================================
   UPLOAD: one button for everything. Every screen shows four steps at the top:
   1 Add file, 2 Reading, 3 Check, 4 Saved. Nothing is saved until every question
   is answered and Save is tapped. After saving, the whole upload can be undone.
   Rule of thumb in this code: answers never change the data directly. What gets
   saved is always worked out fresh from what was read + the answers + any edits,
   so changing an answer (or a question going away) can never leave a stale value.
   ====================================================================== */
let upCsv = null, upBusy = false, readTok = 0, rdTimer = null, lastUpload = null, upId = '';
let impImgs = [], impResult = null, impLines = [], impDateVal = '', impDateEdited = false, impStoreVal = 'Amazon', impAllOpen = false;
let cntResult = null, cntLines = [], cntAllOpen = false;
let depData = null;
let caPays = [], caNet = true; const caOpen = new Set();
const UPSTEPS = ['Add file', 'Reading', 'Check', 'Saved'];
const PRICE_CHIPS = [0.5, 1, 2, 3, 4, 5];
function todayIso(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function daysApart(a, b){ const x = parseDate(a), y = parseDate(b); return x && y ? Math.round(Math.abs(x - y) / 864e5) : 999; }
function cash$(v){ return Number(String(v ?? '').replace(/[$,\s]/g, '')); }
function priceOk(v){ return String(v ?? '').trim() !== '' && cash$(v) >= 0; }
function r2(v){ return Math.round(v * 100) / 100; }
function showNum(v){ return blank(v) ? 'blank' : String(num(v)); }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function listJoin(a){ return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function newId(prefix, k){ return prefix + upId + 'u' + k; } // the same on every try, so a retried save can't add a row twice
function steps(n){ return '<ol class="steps" aria-label="Upload steps">' + UPSTEPS.map((s, i) => `<li class="${i + 1 < n ? 'done' : i + 1 === n ? 'on' : ''}"${i + 1 === n ? ' aria-current="step"' : ''}><b>${i + 1 < n ? '✓' : i + 1}</b><span>${s}</span></li>`).join('') + '</ol>'; }
function paws(n, mini){ return `<div class="pawtrail${mini ? ' mini' : ''}" aria-hidden="true">` + Array.from({ length: n }, (_, i) => `<i class="paw" style="--i:${i}"></i>`).join('') + '</div>'; }
function guard(on){ $('#sheet').dataset.guard = on ? '1' : ''; }
function focusKey(el){
  if (!el || !el.closest || !el.closest('#sheet')) return null;
  for (const a of ['data-qf', 'data-cq', 'data-cnt', 'data-dep', 'data-imp', 'data-ch', 'id']) { const v = el.getAttribute(a); if (v) return [a, v]; }
  return null;
}
/* redraw the open window without jumping to the top or losing the box being typed in */
function reSheet(html){

  let sel = null; try { sel = fk && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null; } catch (e) {}
  s.classList.add('wide'); s.innerHTML = html; s.scrollTop = y; $('#scrim').hidden = false;
  if (fk) { const el = s.querySelector('[' + fk[0] + '="' + CSS.escape(fk[1]) + '"]'); if (el) { el.focus({ preventScroll: true }); try { if (sel) el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}

function fileToBase64(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); }); }
function shrinkImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1800, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', 0.85); URL.revokeObjectURL(url);
      resolve({ media_type: 'image/jpeg', data: d.split(',')[1], preview: d });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };

async function addImpFiles(files){
  const err = $('#iErr'); if (err && files.length) err.textContent = '';
  for (const f of [...files]) {
    const nm = String(f.name || '').toLowerCase();
    if (/\.csv$/.test(nm) || /csv/.test(f.type)) { upCsv = { name: f.name, text: await f.text() }; continue; }
    if (impImgs.length >= 8) { if (err) err.textContent = 'That is the most it takes at once (8). Upload the rest after.'; break; }
    if (f.type === 'application/pdf' || /\.pdf$/.test(nm)) { if (f.size > 8e6) { if (err) err.textContent = 'That PDF is too big. Take a screenshot of it instead.'; continue; } impImgs.push({ media_type:'application/pdf', data: await fileToBase64(f), preview: '', label: f.name }); continue; }
    if (/^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp|gif)$/.test(nm)) { try { impImgs.push(await shrinkImage(f)); } catch (e) { if (err) err.textContent = "One of those pictures couldn't be opened. Try taking the photo again."; } }
    else if (err) err.textContent = "That kind of file can't be read. Use a photo, a screenshot, a PDF or the Cash App CSV.";
  }
  const t = $('#thumbs'); if (!t) return;
  t.innerHTML = thumbsHtml(true);
  const ph = impImgs.filter(i => i.preview).length, pd = impImgs.length - ph, r = $('#upReady'), b = $('#upRead');
  const parts = [ph ? plural(ph, 'photo') : '', pd ? plural(pd, 'PDF') : '', upCsv ? 'the Cash App file' : ''].filter(Boolean);
  if (r) r.innerHTML = parts.length ? '<span class="tick">✓</span> ' + esc(listJoin(parts)) + ' added. ' + (ph === 1 && !pd && !upCsv ? 'If the count sheet has a second page, add that photo too. ' : '') + 'Then tap <b>Read it</b>.' : '';

/* ---------- remembered answers: after the same answer 3 times in a row, it answers for you ---------- */
const LEARN_AT = 3;

function depSale(date){ return rows('sales').filter(s => s.date && String(s.date) <= date && daysApart(s.date, date) <= 7).sort((a, b) => String(b.date).localeCompare(String(a.date)))[0] || null; }
function startDeposit(r){
  const dt = /^\d{4}-\d{2}-\d{2}$/.test(r.date || '') ? r.date : '', a = num(r.amount) > 0 ? r2(num(r.amount)) : 0;
  depData = { date0: dt, amount0: a, what: r.what || 'Cash deposit', note: r.note || '', ed: {} };

}
/* what the deposit works out to: slip amount, date, sale, and the starting cash taken out only here */
function depEff(){

  const gross = 'amount' in d.ed ? r2(cash$(d.ed.amount)) : d.amount0 > 0 ? d.amount0 : r2(cash$(qv('amt', 'v', 0)));

  return { date, gross: gross > 0 ? gross : 0, sale, forSale, sc, takeOut, amount: gross > 0 ? r2(gross - takeOut) : 0, note: 'note' in d.ed ? d.ed.note : (d.note || 'From a deposit slip photo') };
}

    need: (a, v) => cash$(v.v) > 0 ? '' : 'Type the amount.' });
  if (!d.date0 && !('date' in d.ed)) out.push({ id:'date', text:'What day was the deposit made?', sub:"The date wasn't clear on the photo.", opts: [{ v:'today', label:'Today', rec: true }, { v:'pick', label:'A different day' }],
    fields: a => a === 'pick' ? `<input class="in" type="date" data-qf="date|d" value="${esc(qv('date', 'd', ''))}" aria-label="Deposit date">` : '', need: (a, v) => a === 'pick' && !v.d ? 'Pick the date.' : '' });
  if (e.sale && e.sale.date !== e.date) out.push({ id:'sale', text: `${fdate(e.date, true)} isn't a sale day. Is this the deposit for <b>${esc(e.sale.theme)}</b> on ${fdate(e.sale.date)}?`,

function depPlan(){

/* ---------- Cash App report (CSV) ---------- */
const CA_CATS = [['store','Spirit store'],['sponsors','Class sponsors'],['shirts','Spirit shirts'],['other','Other fundraising'],['skip','Leave out']];
function csvParse(text){
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); out.push(row); row = []; cell = ''; } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); out.push(row); }
  return out;
}
function guessCat(note){
  const s = String(note || '').toLowerCase();
  if (/shirt|\btee|dri ?-?fit|dry ?fit|youth|adult|\b(xs|sm|med|lg|xl|xxl)\b|size/.test(s)) return ['shirts', false];
  if (/christmas|holiday/.test(s)) return ['other', false];
  if (/sponsor|face ?paint|painting|paint the school/.test(s)) return ['sponsors', false];
  if (/spirit|store|🦁|\bss\b|squish|bracelet|necklace|paint kit|hair|pom|glasses|haul|goods/.test(s)) return ['store', false];
  if (/\b(mrs?|ms|miss)\.?\s|grade|class/.test(s)) return ['sponsors', true];
  return ['store', true];
}
const caShort = id => String(id).slice(0, 12); // short form keeps the "already imported" list inside one sheet cell
function caSeenSet(){ return new Set(String(setting('cashappSeen') || '').split(',').filter(Boolean).map(caShort)); }
function startCashApp(text){
  if (!isAdmin()) return readFailed('Cash App files need the admin PIN. Ask the admin to upload it.', true);
  const rowsCsv = csvParse(String(text || '').replace(/^\ufeff/, ''));
  const h = (rowsCsv[0] || []).map(x => x.trim()), ix = k => h.indexOf(k);
  if (ix('Transaction ID') < 0 || ix('Net Amount') < 0 || ix('Amount') < 0) return readFailed("That file isn't a Cash App report. In Cash App, go to Activity, then Statements, then Export CSV.", true);
  const seen = caSeenSet();
  const m = v => Number(String(v || '').replace(/[$,\s]/g, '')) || 0;
  caPays = rowsCsv.slice(1).filter(r => r.length > 3).map(r => ({ date: String(r[ix('Date')] || '').slice(0, 10), id: r[ix('Transaction ID')], type: r[ix('Transaction Type')], amount: m(r[ix('Amount')]), net: m(r[ix('Net Amount')]), status: r[ix('Status')], note: r[ix('Notes')] || '', from: r[ix('Name of sender/receiver')] || '' }))
    .filter(p => p.id && p.type === 'P2P' && p.amount > 0 && /complete/i.test(p.status));
  if (!caPays.length) return readFailed('No money coming in was found in that Cash App file.', true);
  const salesSorted = rows('sales').filter(s => s.date).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const firstSale = salesSorted.length ? String(salesSorted[0].date) : '', live = liveSale();
  caPays.forEach(p => {
    const [c, unsure] = guessCat(p.note); p.guess = c; p.user = ''; p.unsure0 = unsure; p.shirt0 = c === 'shirts';
    p.dup = seen.has(caShort(p.id)); p.old = !!(firstSale && p.date < firstSale);
    const s = salesSorted.find(s => String(s.date) >= p.date) || live || salesSorted[salesSorted.length - 1];

function caCat(p){ const a = act('p' + p.id); return a !== undefined ? a : (p.user || p.guess); }

    ${fresh.length ? qPanel() : `<div class="banner ok"><span class="ico">✓</span><span><b>Nothing new in this file.</b> Every payment in it is already in the tracker.</span></div>`}
    ${fresh.length ? `<h4 class="sub-h">Goes into Money in</h4>${body || '<p class="muted">Nothing from this file goes into Money in.</p>'}
      ${leftOut.length ? `<details class="more" id="caLeft"${caOpen.has('left') ? ' open' : ''}><summary>Left out (${leftOut.length}). Change any of these to bring it back.</summary>${leftOut.map(payRow).join('')}</details>` : ''}
      <label class="chk mt"><input type="checkbox" id="caNet"${caNet ? ' checked' : ''}> Use what landed after Cash App fees (recommended)</label>` : ''}
    ${info.length ? '<p class="muted small-t">Skipped: ' + esc(info.join(', ')) + '.</p>' : ''}
    <div id="saveState" aria-live="polite"></div><div class="err" id="iErr" role="alert"></div>
    <div class="acts">${fresh.length ? '<button class="btn ghost" type="button" data-close>Cancel</button><button class="btn ghost" type="button" id="upBack">Start over</button>' + saveBtn('caSave', 'Save to Money in') : '<button class="btn primary" type="button" data-close>Close</button>'}</div>`);
}
async function saveCashApp(){
  if (upBusy || !readyToSave()) return;

  if (!p.ops.length) { closeSheet(); return; }
  doSave('caSave', p.ops.concat(learnOps(qLearnPairs())), p.lines ? 'Saved ' + plural(p.lines, 'Cash App line') + ' to Money in.' : 'Nothing new went into Money in. These payments are marked as checked, so they will not come up again.', 'money', renderCashApp);
}

function openCloseout(M){
  if (pendingCount()) { toast('Submit or discard your open changes first.'); return; }
  const d = parseDate(setting('eventDate')) || new Date(); d.setDate(d.getDate() + 14);
  const nd = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  openSheet(`<h3>Close out ${esc(M.ev)}</h3>
    <p>This locks in ${esc(M.ev)} at <b>${money(M.cash.money !== null ? M.cash.money : M.T.rev)}</b> in sales${M.cash.money !== null ? ' (cash plus Cash App)' : ' (from the item counts, since the cash box isn\'t counted yet)'} and <b>${money(M.purchTotal)}</b> spent, carries counted leftovers forward as on-hand stock, and clears the cash box for the next sale.${M.T.counted < M.T.n ? ' <b class="warn">' + (M.T.n - M.T.counted) + ' items have no after-sale count; they carry forward as unsold.</b>' : ''}</p>
    <form id="closeForm" class="form"><div><label class="lbl" for="nName">Next sale name</label><input class="in" id="nName" value="Fall Festival" required></div>
    <div><label class="lbl" for="nDate">Next sale date</label><input class="in" id="nDate" type="date" value="${nd}" required></div>
    <div class="err" id="cErr"></div>
    <div class="acts"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Close out and start</button></div></form>`);
}
async function doCloseout(name, date){
  const btn = document.querySelector('#closeForm button[type=submit]'); if (btn) { btn.disabled = true; btn.textContent = 'Working…'; }
  try { const fresh = await apiLoad(); if (fresh.ok) data = fresh.data; } catch (e) {}
  if (pendingCount()) { $('#cErr').textContent = 'Submit or discard your open changes first.'; if (btn) { btn.disabled = false; btn.textContent = 'Close out and start'; } return; }
  if (setting('eventName') === name) { closeSheet(); render(); toast(name + ' is already the current sale. Nothing changed.'); return; }
  const M = model(), ops = [];
  const set = (table, id, field, value) => { const r = serverRow(table, id); if (r && normVal(table, field, r[field], id) !== normVal(table, field, value, id)) ops.push({ op:'set', table, id, field, prev: r[field] ?? '', value }); };
  for (const i of M.items) {
    set('items', i.id, 'onHand', i.counted === null ? i.avail : i.counted);
    set('items', i.id, 'countedAfter', '');
    if (i.costFromOrders) set('items', i.id, 'unitCost', Math.round(i.unitCost * 10000) / 10000);
    if (i.category === 'New' || i.category === 'Restock') set('items', i.id, 'category', 'Carry-over');
  }
  for (const p of M.cur) if (M.liveId && String(p.sale) !== M.liveId) set('purchases', p.id, 'sale', M.liveId);
  const realSales = M.cash.money !== null ? M.cash.money : (M.T.rev ? Math.round(M.T.rev*100)/100 : '');
  for (const s of M.sales) if (s.live) { set('sales', s.id, 'spent', Math.round(M.purchTotal*100)/100); set('sales', s.id, 'sales', realSales); set('sales', s.id, 'link', ''); }
  for (const r of M.mOut) if (r.link === 'purchases') { set('moneyOut', r.id, 'amount', Math.round(M.purchTotal*100)/100); set('moneyOut', r.id, 'link', ''); }
  set('cash', 'end', 'value', ''); set('cash', 'cashapp', 'value', ''); set('cash', 'countedBy', 'value', ''); set('cash', 'notes', 'value', '');
  set('settings', 'eventName', 'value', name); set('settings', 'eventDate', 'value', date); set('settings', 'announcement', 'value', '');
  const sid = Date.now().toString(36);
  ops.push({ op:'add', table:'sales', row:{ id:'sh' + sid, date, theme:name, spent:'', sales:'', other:'', what:'', link:'current' } });
  ops.push({ op:'add', table:'moneyIn', row:{ id:'mi' + sid + 'a', date, event: name + ' (cash deposit)', amount:'', notes:'Enter the deposit' } });
  ops.push({ op:'add', table:'moneyIn', row:{ id:'mi' + sid + 'b', date, event: name + ' (Cash App)', amount:'', notes:'Enter the Cash App total' } });
  ops.push({ op:'add', table:'moneyOut', row:{ id:'mo' + sid, date:'', order: name + ' orders', amount:'', link:'purchases', notes:'Fills in automatically from the Orders tab' } });
  let res;
  try { res = await apiPost({ action:'save', pin: auth.pin, name: who, ops, atomic: true }); }
  catch (e) { $('#cErr').textContent = 'Could not reach the tracker. Reload the page before trying again, in case it went through.'; if (btn) { btn.disabled = false; btn.textContent = 'Close out and start'; } return; }
  if (!res.ok) { $('#cErr').textContent = res.error || 'Could not close out.'; if (btn) { btn.disabled = false; btn.textContent = 'Close out and start'; } return; }
  if ((res.conflicts || []).length) { data = res.data; render(); $('#cErr').textContent = 'Someone changed numbers at the same moment, so nothing was closed out. Check the counts and try again.'; if (btn) { btn.disabled = false; btn.textContent = 'Close out and start'; } return; }
  data = res.data; closeSheet(); tab = 'overview'; render();
  toast(name + ' is ready. Counts carried forward.');
}

    if (f === 'target') { l.target = e.target.value; renderImportReview(); return; }
    return laterRedraw();
  }
});

document.addEventListener('toggle', e => { if (e.target.id === 'cntAll') cntAllOpen = e.target.open; if (e.target.id === 'impAll') impAllOpen = e.target.open; if (e.target.id === 'caLeft') { if (e.target.open) caOpen.add('left'); else caOpen.delete('left'); } }, true);
document.addEventListener('click', e => {
  const im = e.target.closest && e.target.closest('.thumbs.view img'); if (im) { im.classList.toggle('big'); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.q !== undefined) return qAnswer(b.dataset.q, b.dataset.qv);
  if (b.dataset.qset !== undefined) { const [id, k, v] = b.dataset.qset.split('|'); return qInput(id, k, v, true); }
  if (b.dataset.qchange !== undefined) return qChange(b.dataset.qchange);
  if (b.id === 'qAll') return qAll();
  if (b.id === 'rdCancel') { readTok++; upBusy = false; stopReading(); openUpload(true); return toast('Stopped. Nothing was saved.'); }
  if (b.id === 'rdRetry') return readUpload();
  if (b.id === 'upMore') return openUpload(true);
  if (b.id === 'undoUp') return undoUpload();
  if (b.id === 'doneUp') return closeSheet();
  if (b.dataset.tab) return go(b.dataset.tab);
  if (b.dataset.close !== undefined) return closeSheet();
  if (b.dataset.phase) { phase = b.dataset.phase; store.set('css-phase', phase); showDetails = false; return render(); }
  if (b.dataset.cat) { catFilter = b.dataset.cat; return render(); }
  if (b.dataset.step) {
    const el = document.getElementById(b.dataset.for); if (!el) return;
    el.value = String(Math.max(0, num(el.value) + Number(b.dataset.step))); onEdit(el); patchCalcs(); return;
  }

    go(n.t);
    if (n.id) { const [t, id] = n.id.split('|'); const row = document.getElementById('row-' + t + '-' + id); if (row) { row.scrollIntoView({ block:'center' }); const inp = row.querySelector('.amt input'); if (inp) inp.focus({ preventScroll:true }); } }
    return;
  }
  if (b.dataset.addrow) return newRow(b.dataset.addrow);
  if (b.dataset.del) {
    const [t, id] = b.dataset.del.split('|');
    const a = addRow(t, id);
    if (a) pending.adds = pending.adds.filter(x => x !== a);
    else pending.dels[t + '|' + id] = { op:'del', table:t, id };
    render(); toast('Marked for removal. Submit to save, or Discard to undo.'); return;

  if (b.dataset.psnophoto !== undefined) { psPending[b.dataset.psnophoto] = 'none'; return psRefreshRow(b.dataset.psnophoto); }

document.addEventListener('submit', async e => {
  e.preventDefault();

    try {
      const res = await apiPost({ action:'auth', pin });
      if (!res.ok) { $('#uErr').textContent = res.error || 'That PIN did not work.'; return; }
      const draftBy = store.get('css-draft-who', '');
      if (pendingCount() && draftBy && draftBy !== name) { pending = { sets:{}, adds:[], dels:{} }; store.set('css-draft', pending); setTimeout(() => toast('Cleared unsaved changes left on this device by ' + draftBy + '.'), 4000); }
      auth = { role: res.role, pin }; who = name; store.sset('css-auth', auth); store.set('css-name', name);
      closeSheet(); render(); toast(res.role === 'admin' ? 'Unlocked with full access.' : 'Unlocked. You can enter counts, deposits and the cash box.');

/* Phones and home-screen apps hold on to an old copy of this page. When a newer one is live, switch to it,
   but never in the middle of something: unsaved changes or an open window wait for the next check. */
let verAt = 0;
async function checkVersion(){
  if (DEMO || !/^[0-9a-f]{6,}$/.test(BUILD) || Date.now() - verAt < 45000) return;
  verAt = Date.now();
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = String((await r.json()).build || '');
    if (!/^[0-9a-f]{6,}$/.test(v) || v === BUILD) return;
    let tried = ''; try { tried = sessionStorage.getItem('css-ver-tried') || ''; } catch (e) {}
    if (tried === v) return; // already switched once for this build; never loop
    if (pendingCount() || !$('#scrim').hidden || upBusy) { verAt = Date.now() - 30000; return; } // try again in about 15 seconds
    try { sessionStorage.setItem('css-ver-tried', v); } catch (e) {}
    location.replace(location.pathname + '?v=' + v + location.hash);
  } catch (e) {}
}
if (!DEMO) { setTimeout(checkVersion, 1500); setInterval(() => { if (document.visibilityState === 'visible') checkVersion(); }, 60000); }
