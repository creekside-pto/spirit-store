/* Brand: Livingston ISD green #0C482D and white, taken from the district site and logo. Pink is only for the Pink Out event chip.
   Layout: green band header, tab strip, one working column (max 1080px). Yellow-tinted boxes are the inputs, same rule as the old spreadsheet. */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --surface-2:#E2EBE6; --ink:#0F2219; --muted:#536A5E; --line:#CCDAD2;
  --band:#0C482D; --band-ink:#FFFFFF; --gold:#FFFFFF; --accent:#0C482D; --accent-ink:#FFFFFF; --focus:#2E8B57;
  --pink:#D23C74; --pink-soft:#FBE1EB; --input:#FFF7DC; --input-line:#E6CF85;
  --good:#1D7443; --good-soft:#DDF0E3; --warn:#9A5B00; --warn-soft:#FFEFCC; --bad:#B0233A; --bad-soft:#FBE2E6;
  --shadow:0 1px 2px rgba(19,36,26,.06),0 4px 14px rgba(19,36,26,.06);
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1510; --surface:#142019; --surface-2:#1B2A21; --ink:#E5EEE7; --muted:#97A99D; --line:#2A3B30;
  --band:#0A3A25; --band-ink:#F2F8F4; --gold:#F2F8F4; --accent:#74C69D; --accent-ink:#0A1A12; --focus:#74C69D;
  --pink:#F06A9C; --pink-soft:#3A1726; --input:#2A2714; --input-line:#5E5323;
  --good:#6CC891; --good-soft:#163323; --warn:#F0B24B; --warn-soft:#33270F; --bad:#F07A8C; --bad-soft:#3A161D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1510; --surface:#142019; --surface-2:#1B2A21; --ink:#E5EEE7; --muted:#97A99D; --line:#2A3B30;
  --band:#0A3A25; --band-ink:#F2F8F4; --gold:#F2F8F4; --accent:#74C69D; --accent-ink:#0A1A12; --focus:#74C69D;
  --pink:#F06A9C; --pink-soft:#3A1726; --input:#2A2714; --input-line:#5E5323;
  --good:#6CC891; --good-soft:#163323; --warn:#F0B24B; --warn-soft:#33270F; --bad:#F07A8C; --bad-soft:#3A161D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

.alldone{display:flex;align-items:center;gap:10px}
.pride{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:36px;color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.pride .paw{color:var(--accent);opacity:.7}
.pride .paw:nth-child(2){transform:rotate(15deg) translateY(-4px)}
.pride .paw:nth-child(4){transform:rotate(-15deg) translateY(-4px)}
.band .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.brand svg{flex:none;width:42px;height:42px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:23px;letter-spacing:.02em;line-height:1.05;color:var(--gold);text-transform:uppercase}
.brand .logo{flex:none;height:60px;width:60px;background:#FFFFFF;border-radius:50%;padding:5px;object-fit:contain;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
@media (max-width:520px){.brand .logo{height:50px;width:50px}.brand h1{font-size:20px}}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85;letter-spacing:.02em}
.chip-event{display:inline-flex;align-items:center;gap:8px;background:var(--event,var(--pink));color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.chip-event .dot{width:8px;height:8px;border-radius:50%;background:#fff}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{font-size:12px;opacity:.85}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.in:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.band .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:var(--band-ink)}
.band .btn.on{background:#FFFFFF;color:#0C482D;border-color:#FFFFFF}
/* tabs */
.tabbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;line-height:18px;text-align:center}
.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13.5px;border:1px solid var(--input-line)}
.notice b{color:var(--warn)}
main{padding-block:18px 120px}
section+section{margin-top:22px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:18px;font-weight:800}
.sec-h p{margin:0;color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.profit{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.profit .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.equation{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:14px;font-size:14px}
.equation .term{display:flex;flex-direction:column;background:var(--surface-2);border-radius:10px;padding:7px 11px}
.equation .term b{font-size:16px}
.equation .term span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.equation .op{font-weight:800;color:var(--muted);font-size:18px}
.foot{color:var(--muted);font-size:12.5px;margin-top:12px}
.event{padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.event::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--event,var(--pink))}
.event-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.announce{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;margin-bottom:16px;background:var(--surface);border:2px solid var(--event,var(--pink));box-shadow:var(--shadow);font-size:15.5px;font-weight:600;white-space:pre-line}
.announce .paw{color:var(--event,var(--pink));font-size:22px;margin-top:1px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 6px;cursor:pointer;font-weight:600;font-size:13px}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches i{width:18px;height:18px;border-radius:50%;display:block}
.swatches input:checked+i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
textarea.in{min-height:84px;resize:vertical;font:inherit}
.event h3{font-size:16px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-size:20px;font-weight:800}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--event,var(--pink));border-radius:99px}
/* needs */
.needs{display:grid;gap:8px}
.need{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.need:hover{border-color:var(--accent)}
.need .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.need .tx{flex:1;min-width:0}
.need .tx small{display:block;color:var(--muted);font-size:12.5px}
.need .go{color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.alldone{padding:14px;border-radius:12px;background:var(--good-soft);color:var(--good);font-weight:600}
/* pills */
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.new{background:var(--pink-soft);color:var(--pink)}
.pill.restock{background:var(--warn-soft);color:var(--warn)}
.pill.donated{background:var(--good-soft);color:var(--good)}
.pill.out{background:var(--bad);color:#fff}
.pill.low{background:var(--warn-soft);color:var(--warn)}
/* inputs */
.in{background:var(--input);border:1px solid var(--input-line);border-radius:9px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.in.numin{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.in.dirty{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-soft)}
.in.empty{border-style:dashed}
.ro{display:inline-block}
.blank{color:var(--muted)}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:4px;align-items:center}
.stepper button{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:18px;cursor:pointer}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* item rows */
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 170px 120px;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item .nm{font-weight:700;min-width:0}
.item .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.item .cell span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.item .cell b{font-size:16px}
.item .res{text-align:right}
.item-head{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 170px 120px;gap:12px;padding:0 14px 2px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.item-head .r{text-align:right}
@media (max-width:760px){
  .item-head{display:none}
  .item{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .item .nm{grid-column:1/-1}
  .item .entry{grid-column:1/-1;order:5}
  .item .res{text-align:left}
}
.item.details{grid-template-columns:minmax(0,2fr) 130px 100px 100px minmax(0,1.4fr) auto}
@media (max-width:760px){.item.details{grid-template-columns:repeat(2,minmax(0,1fr))}.item.details .wide{grid-column:1/-1}}
.lbl{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:14px;margin-top:12px}
/* list rows (money etc) */
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:120px minmax(0,1.3fr) 150px minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row .when{color:var(--muted);font-size:13px}
.row .what{font-weight:700;min-width:0}
.row .note{color:var(--muted);font-size:13px;min-width:0}
.row .amt{text-align:right;font-weight:700}
.row.need-it{border-color:var(--input-line);background:linear-gradient(0deg,var(--surface),var(--surface))}
@media (max-width:760px){.row{grid-template-columns:minmax(0,1fr) 140px}.row .when{grid-column:1/-1;order:-1}.row .note{grid-column:1/-1}.row .act{grid-column:1/-1}}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800;font-size:16px}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.results>div{padding:16px;border-right:1px solid var(--line)}
.results>div:last-child{border-right:0}
.results span{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.results b{font-size:22px}
@media (max-width:620px){.results{grid-template-columns:1fr}.results>div{border-right:0;border-bottom:1px solid var(--line)}.results>div:last-child{border-bottom:0}}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
/* cash */
.cashgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.cashgrid{grid-template-columns:1fr}}
.form{display:grid;gap:12px}
.calc{display:grid;gap:0}
.calc div{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.calc div:last-child{border-bottom:0}
.calc .final{font-size:20px;font-weight:800}
/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--surface-2)}
td .in{min-height:36px;padding:6px 8px}
/* activity */
.log{display:grid;gap:0}
.log .ent{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.log .ent:last-child{border-bottom:0}
.log .t{color:var(--muted);font-size:12.5px}
@media (max-width:620px){.log .ent{grid-template-columns:minmax(0,1fr) auto}.log .t{grid-column:1/-1}}
/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.savebar .msg{flex:1;min-width:0;font-weight:600}
.savebar .btn{border-color:transparent}
.savebar .btn.primary{background:var(--pink);color:#fff}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,8,.55);z-index:30;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:6px}
.sheet p{color:var(--muted);margin:0 0 14px}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet ul{margin:0 0 6px;padding-left:18px}
.err{color:var(--bad);font-weight:600;font-size:13.5px;min-height:1em}
.sheet.wide{max-width:920px}
.drop{position:relative;border:2px dashed var(--input-line);background:var(--input);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);font-weight:600}
.drop.over{border-color:var(--accent)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs figure{margin:0;position:relative}
.thumbs img{height:76px;width:auto;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-weight:800;cursor:pointer;line-height:1}
details.paste summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:12px}
.imp-head{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.imp-line{display:grid;grid-template-columns:26px minmax(0,2.2fr) 74px 96px 86px;gap:8px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.imp-line.off{opacity:.45}
.imp-line .lbl{display:none}
.imp-line .title{font-size:12.5px;color:var(--muted);margin-top:4px}
.imp-line .newfields{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;margin-top:8px}
.imp-line input[type=checkbox]{width:20px;height:20px;margin-top:10px}
.imp-cols{display:grid;grid-template-columns:26px minmax(0,2.2fr) 74px 96px 86px;gap:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.imp-sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 0;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px}
.tag.match{background:var(--good-soft);color:var(--good)}.tag.new{background:var(--pink-soft);color:var(--pink)}
@media (max-width:640px){.imp-line .lbl{display:block}.imp-cols{display:none}.imp-line{grid-template-columns:26px repeat(3,minmax(0,1fr))}.imp-line .goes{grid-column:2/-1}.imp-line .n1{grid-column:2}.imp-head{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--band-ink);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.mt{margin-top:12px}
.empty-state{padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.need{transition:background .15s,border-color .15s}}
</style>

<body>
<header class="band">

/* ===== Shared rules: used by both the web page and the Google Apps Script backend ===== */
var SCHEMA = {
  items: { tab: 'Items', cols: [['id','ID'],['name','Item'],['category','Category'],['price','Sell Price'],['unitCost','Cost per Unit (if no order)'],['onHand','On Hand Before'],['countedAfter','Counted After'],['notes','Notes']] },

var NUMERIC = {
  items: ['price','unitCost','onHand','countedAfter'],
  purchases: ['packs','packCost','unitsPerPack'],
  moneyIn: ['amount'], moneyOut: ['amount'],
  sales: ['spent','sales','other']
};
/* What a volunteer PIN may change. The admin PIN may change everything. */
var VOLUNTEER_CAN = {
  items: ['onHand','countedAfter','notes'],
  moneyIn: ['amount','notes'],
  cash: ['value']
};
var CASH_NUMERIC_IDS = ['start','end','cashapp'];
var NONNEGATIVE = ['price','unitCost','onHand','countedAfter','packs','packCost','unitsPerPack'];

function fieldsOf(table) { return SCHEMA[table].cols.map(function (c) { return c[0]; }); }
function isNumeric(table, field, id) {
  if (table === 'cash' && field === 'value') return CASH_NUMERIC_IDS.indexOf(String(id)) >= 0;
  if (table === 'settings' && field === 'value') return String(id) === 'startCash';
  return (NUMERIC[table] || []).indexOf(field) >= 0;
}
function cleanVal(table, field, v, id) {
  if (v === null || v === undefined) return '';
  if (isNumeric(table, field, id)) {
    var s = String(v).replace(/[$,\s]/g, '');
    if (s === '') return '';
    if (/^\(.*\)$/.test(s)) s = '-' + s.slice(1, -1);
    var n = Number(s);
    if (!isFinite(n)) return '';
    if (n < 0 && NONNEGATIVE.indexOf(field) >= 0) return '';
    return n;
  }
  return String(v).trim();
}
function normVal(table, field, v, id) {
  var c = cleanVal(table, field, v, id);
  if (c === '') return '';
  if (typeof c === 'number') return String(Math.round(c * 10000) / 10000);
  return c;
}
function canDo(role, op) {
  if (role === 'admin') return true;
  if (role !== 'volunteer') return false;
  return op.op === 'set' && (VOLUNTEER_CAN[op.table] || []).indexOf(op.field) >= 0;
}
function labelOf(table, row) {
  if (!row) return '';
  var k = { items: 'name', purchases: 'item', moneyIn: 'event', moneyOut: 'order', sales: 'theme', cash: 'label', settings: 'id' }[table];
  return String(row[k] || row.id || '');
}
/* Apply a batch of edits to in-memory tables. Each "set" carries the value the editor started from (prev);
   if someone else changed that value in the meantime, the edit is held back as a conflict instead of overwriting. */
function applyOps(t, ops, role, who, nowIso, atomic) {
  if (atomic) {
    // all or nothing: dry-run on a copy first, apply only if every edit is clean
    var trial = applyOps(JSON.parse(JSON.stringify(t)), ops, role, who, nowIso, false);
    if (trial.conflicts.length) return { applied: 0, conflicts: trial.conflicts, log: [], rejected: true };
  }
  var res = { applied: 0, conflicts: [], log: [] };
  for (var i = 0; i < ops.length; i++) {
    var op = ops[i];
    if (!op || !SCHEMA[op.table] || op.table === 'log' || !t[op.table]) { res.conflicts.push({ op: op, reason: 'unknown section' }); continue; }
    if (!canDo(role, op)) { res.conflicts.push({ op: op, reason: 'not allowed with this PIN' }); continue; }
    var table = t[op.table], fields = fieldsOf(op.table);
    if (op.op === 'set') {
      if (fields.indexOf(op.field) < 0 || op.field === 'id') { res.conflicts.push({ op: op, reason: 'unknown field' }); continue; }
      var row = null;
      for (var j = 0; j < table.length; j++) if (String(table[j].id) === String(op.id)) { row = table[j]; break; }
      if (!row) { res.conflicts.push({ op: op, reason: 'row was removed' }); continue; }
      var cur = normVal(op.table, op.field, row[op.field], op.id);
      var nv = cleanVal(op.table, op.field, op.value, op.id);
      if (cur === normVal(op.table, op.field, nv, op.id)) continue;
      if (cur !== normVal(op.table, op.field, op.prev, op.id)) { res.conflicts.push({ op: op, reason: 'changed', current: row[op.field] }); continue; }
      res.log.push({ time: nowIso, name: who, role: role, table: op.table, rowId: String(op.id), field: op.field, old: row[op.field] === undefined ? '' : String(row[op.field]), 'new': String(nv) });
      row[op.field] = nv; res.applied++;
    } else if (op.op === 'add') {
      var src = op.row || {}, nr = {};
      for (var f = 0; f < fields.length; f++) nr[fields[f]] = cleanVal(op.table, fields[f], src[fields[f]], src.id);
      if (!nr.id) nr.id = op.table.slice(0, 2) + Date.now().toString(36) + Math.floor(Math.random() * 1e4);
      var dup = false;
      for (var k = 0; k < table.length; k++) if (String(table[k].id) === String(nr.id)) dup = true;
      if (dup) { res.conflicts.push({ op: op, reason: 'duplicate' }); continue; }
      table.push(nr);
      res.log.push({ time: nowIso, name: who, role: role, table: op.table, rowId: String(nr.id), field: '(added)', old: '', 'new': labelOf(op.table, nr) });
      res.applied++;
    } else if (op.op === 'del') {
      var idx = -1;
      for (var m = 0; m < table.length; m++) if (String(table[m].id) === String(op.id)) idx = m;
      if (idx < 0) continue;
      res.log.push({ time: nowIso, name: who, role: role, table: op.table, rowId: String(op.id), field: '(removed)', old: labelOf(op.table, table[idx]), 'new': '' });
      table.splice(idx, 1); res.applied++;
    }
  }
  return res;
}

const num = v => { if (v === '' || v === null || v === undefined) return 0; const n = Number(v); return isNaN(n) ? 0 : n; };
const blank = v => v === '' || v === null || v === undefined;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n, opts){ n = Math.round(num(n)*100)/100; const s = '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return n < 0 ? '(' + s + ')' : s; }
function count(n){ return Math.round(num(n)).toLocaleString('en-US'); }
function parseDate(s){ if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return new Date(+m[1], +m[2]-1, +m[3]); const d = new Date(s); return isNaN(d) ? null : d; }
function fdate(s, long){ const d = parseDate(s); if (!d) return ''; return d.toLocaleDateString('en-US', long ? {weekday:'long',month:'short',day:'numeric'} : {month:'short',day:'numeric'}); }
function ftime(iso){ const d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
const FIELD_NAMES = { onHand:'On hand before', countedAfter:'Counted after', price:'Sell price', unitCost:'Cost per unit', name:'Item name', category:'Category', notes:'Notes', amount:'Amount', value:'Value', date:'Date', event:'Event', order:'Order', packs:'Packs', packCost:'Pack cost', unitsPerPack:'Units per pack', item:'Item', store:'Store', source:'Cost source', spent:'Spent', sales:'Sales', other:'Other fundraising', what:'What it was', theme:'Theme', link:'Auto', sale:'For sale' };

/* ---------- data access: server rows + this person's unsaved edits ---------- */
const key = (t, id, f) => t + '|' + id + '|' + f;
function addRow(t, id){ return pending.adds.find(a => a.table === t && a.row.id === id); }
function serverRow(t, id){ return (data?.[t] || []).find(r => String(r.id) === String(id)); }
function rows(t){
  const base = (data?.[t] || []).filter(r => !pending.dels[t + '|' + r.id]).map(r => {
    const o = { ...r };
    for (const f of fieldsOf(t)) { const p = pending.sets[key(t, r.id, f)]; if (p) o[f] = p.value; }
    return o;
  });
  return base.concat(pending.adds.filter(a => a.table === t).map(a => ({ ...a.row, _new: true })));
}
function setting(id){ const r = rows('settings').find(r => r.id === id); return r ? r.value : ''; }
function pendingCount(){ return Object.keys(pending.sets).length + pending.adds.length + Object.keys(pending.dels).length; }
function canEdit(t, f){ if (!auth) return false; if (f === 'id') return false; return canDo(auth.role, { op:'set', table:t, field:f }); }
const isAdmin = () => auth && auth.role === 'admin';

/* ---------- the math (mirrors the original spreadsheet) ---------- */
function liveSale(){ return rows('sales').find(s => s.link === 'current') || null; }
function saleLabel(key){ const r = rows('sales').find(s => String(s.id) === String(key)); return r ? r.theme : key; }
function isCurrentOrder(p, liveId, saleIds, ev){
  if (blank(p.sale)) return true;
  const k = String(p.sale);
  if (saleIds.has(k)) return k === liveId;
  return k === ev; // older rows that still carry the sale name
}
function model(){
  const ev = setting('eventName');
  const live = liveSale(), liveId = live ? String(live.id) : '';
  const saleIds = new Set(rows('sales').map(s => String(s.id)));
  const allP = rows('purchases').map(p => {
    const units = num(p.packs) * num(p.unitsPerPack), total = num(p.packs) * num(p.packCost);
    return { ...p, units, total, cpu: units ? total/units : 0, current: isCurrentOrder(p, liveId, saleIds, ev) };
  });
  const cur = allP.filter(p => p.current);
  const byItem = {};
  for (const p of cur) { const k = String(p.item||'').trim().toLowerCase(); if (!k) continue; byItem[k] = byItem[k] || { units:0, cost:0 }; byItem[k].units += p.units; byItem[k].cost += p.total; }
  const purchTotal = cur.reduce((s,p) => s + p.total, 0), purchUnits = cur.reduce((s,p) => s + p.units, 0);
  const T = { onHand:0, received:0, avail:0, sold:0, rev:0, cos:0, profit:0, shelfAll:0, counted:0, n:0 };
  const items = rows('items').map(i => {
    const b = byItem[String(i.name||'').trim().toLowerCase()];
    const received = b ? b.units : 0;
    const unitCost = b && b.units ? b.cost / b.units : num(i.unitCost);
    const onHand = num(i.onHand), avail = onHand + received;
    const counted = blank(i.countedAfter) ? null : num(i.countedAfter);
    const sold = counted === null ? 0 : Math.max(avail - counted, 0);
    const rev = sold * num(i.price), cos = sold * unitCost;
    const flag = counted === null ? '' : counted === 0 ? 'SOLD OUT' : counted <= 10 ? 'Low' : '';
    T.onHand += onHand; T.received += received; T.avail += avail; T.sold += sold; T.rev += rev; T.cos += cos; T.profit += rev - cos;
    T.shelfAll += unitCost * avail; T.n++; if (counted !== null) T.counted++;
    return { ...i, received, unitCost, costFromOrders: !!(b && b.units), onHand, avail, counted, sold, rev, cos, profit: rev - cos, flag };
  });
  const shelf = T.shelfAll - T.cos;
  const mIn = rows('moneyIn'), mOut = rows('moneyOut').map(r => ({ ...r, amt: r.link === 'purchases' ? purchTotal : num(r.amount) }));
  const totalIn = mIn.reduce((s,r) => s + num(r.amount), 0), totalOut = mOut.reduce((s,r) => s + r.amt, 0);
  const cashRow = id => rows('cash').find(r => r.id === id) || { value:'' };
  const start = num(cashRow('start').value), endBlank = blank(cashRow('end').value), end = num(cashRow('end').value);
  const cashapp = num(cashRow('cashapp').value);
  const taken = endBlank ? null : end - start;
  const sales = rows('sales').map(s => {
    const live = s.link === 'current';
    const spent = live ? purchTotal : (blank(s.spent) ? null : num(s.spent));
    const sl = live ? (T.rev ? T.rev : null) : (blank(s.sales) ? null : num(s.sales));
    const profit = sl === null ? null : sl - (spent || 0);
    return { ...s, live, spentV: spent, salesV: sl, profit, total: profit === null ? null : profit + num(s.other) };
  });
  const itemNames = new Set(items.map(i => String(i.name || '').trim().toLowerCase()));
  const unmatched = cur.filter(p => !blank(p.item) && !itemNames.has(String(p.item).trim().toLowerCase()));
  return { ev, liveId, unmatched, allP, cur, purchTotal, purchUnits, items, T, shelf, mIn, mOut, totalIn, totalOut, net: totalIn - totalOut, real: totalIn - totalOut + shelf,
           cash: { start, end, endBlank, cashapp, taken, expected: T.rev, over: taken === null ? null : taken + cashapp - T.rev }, sales };
}

function needsList(M){
  const out = [];
  for (const r of M.mIn) if (blank(r.amount)) out.push({ t:'money', id:'moneyIn|'+r.id, title:'Enter amount: ' + r.event, sub: fdate(r.date, true) + (r.notes ? ' · ' + r.notes : '') });
  for (const r of M.mOut) if (r.link !== 'purchases' && blank(r.amount)) out.push({ t:'money', id:'moneyOut|'+r.id, title:'Enter cost: ' + r.order, sub: r.notes || 'Money out' });
  const uncounted = M.items.filter(i => blank(i.onHand) && !i.received);
  if (uncounted.length) out.push({ t:'count', phase:'before', title:'Count what is on hand: ' + uncounted.map(i => i.name).slice(0,3).join(', ') + (uncounted.length > 3 ? ' and ' + (uncounted.length-3) + ' more' : ''), sub:'Before the sale' });
  const evDate = parseDate(setting('eventDate')); const today = new Date(); today.setHours(0,0,0,0);
  if (M.T.counted < M.T.n) out.push({ t:'count', phase:'after', title:'After-sale counts: ' + M.T.counted + ' of ' + M.T.n + ' items counted', sub: evDate && evDate > today ? 'Do this right after the sale closes' : 'Sold, revenue and profit fill in from these' });
  if (M.cash.endBlank) out.push({ t:'cash', title:'Count the cash box after closing', sub:'Over or short is checked against the item counts' });
  if (M.unmatched.length) out.push({ t:'orders', title: M.unmatched.length + ' order line' + (M.unmatched.length>1?'s don\'t':' doesn\'t') + ' match an item on the Count tab', sub: M.unmatched.map(p => p.item).slice(0,3).join(', ') + '. Fix the item name so those units get counted (admin)' });
  const nocost = M.items.filter(i => !i.unitCost && i.category !== 'Donated');
  if (nocost.length) out.push({ t:'count', details:true, title: nocost.length + ' item' + (nocost.length>1?'s have':' has') + ' no cost yet', sub: nocost.map(i => i.name).slice(0,3).join(', ') + (nocost.length>3?'…':'') + ' (admin)' });
  return out;
}

/* ---------- rendering ---------- */
function field(t, row, f, o = {}){
  const k = key(t, row.id, f);
  let val = row[f] ?? '';
  const isMoney = ['amount','packCost','price','spent','sales','other'].includes(f) || (t === 'cash' && (row.id === 'start' || row.id === 'end'));
  if (isMoney && !blank(val) && !pending.sets[k] && !row._new && !isNaN(Number(val))) val = Number(val).toFixed(2);
  const numeric = isNumeric(t, f, row.id);
  if (!(row._new ? isAdmin() : canEdit(t, f))) {
    const shown = blank(val) ? '<span class="blank">' + (o.blankText || '·') + '</span>' : (o.fmt ? o.fmt(val) : esc(val));
    return '<span class="ro ' + (numeric ? 'num' : '') + '">' + shown + '</span>';
  }
  const dirty = row._new || !!pending.sets[k];
  const type = o.type || 'text';
  const cls = 'in' + (numeric ? ' numin' : '') + (dirty ? ' dirty' : '') + (blank(val) ? ' empty' : '');
  const inputmode = numeric ? (o.int ? 'numeric' : 'decimal') : (o.inputmode || 'text');
  const id = 'f_' + k.replace(/[^a-zA-Z0-9]/g, '_');
  const list = o.list ? ' list="' + o.list + '"' : '';
  if (o.select) {
    return '<select class="' + cls + '" id="' + id + '" data-k="' + esc(k) + '" aria-label="' + esc(o.label || FIELD_NAMES[f] || f) + '">' +
      o.select.map(v => '<option' + (v === val ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select>';
  }
  const inp = '<input class="' + cls + '" id="' + id + '" data-k="' + esc(k) + '" type="' + type + '" inputmode="' + inputmode + '" value="' + esc(val) + '" placeholder="' + esc(o.ph || '') + '" aria-label="' + esc(o.label || FIELD_NAMES[f] || f) + '" autocomplete="off"' + list + '>';
  if (o.stepper) return '<div class="stepper"><button type="button" data-step="-1" data-for="' + id + '" aria-label="Minus one">−</button>' + inp + '<button type="button" data-step="1" data-for="' + id + '" aria-label="Plus one">+</button></div>';
  return inp;
}
function catPill(c){ const cls = { 'New':'new', 'Restock':'restock', 'Donated':'donated' }[c] || ''; return c ? '<span class="pill ' + cls + '">' + esc(c) + '</span>' : ''; }
function flagPill(f){ return f === 'SOLD OUT' ? '<span class="pill out">Sold out</span>' : f === 'Low' ? '<span class="pill low">Low</span>' : ''; }

function renderHeader(M){
  $('#org').textContent = setting('orgName') || 'Creekside Lions PTO';
  $('#school').textContent = (setting('schoolLine') ? setting('schoolLine') + ' · ' : '') + 'Spirit Store';
  $('#eventTxt').textContent = (setting('eventName') || 'Next sale') + (setting('eventDate') ? ' · ' + fdate(setting('eventDate'), true) : '');
  const ec = EVENT_COLORS.find(c => c[0] === setting('eventColor')); document.documentElement.style.setProperty('--event', ec ? ec[1] : '#D23C74');
  const lb = $('#lockBtn');
  lb.textContent = auth ? (who ? who + ' · ' : '') + (auth.role === 'admin' ? 'Admin' : 'Volunteer') + ' · Lock' : 'Unlock to edit';
  lb.classList.toggle('on', !!auth);
  $('#adminBtn').hidden = !isAdmin();
  $('#sync').textContent = loadError ? loadError : DEMO ? 'Preview mode' : lastSync ? 'Updated ' + lastSync.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : 'Loading…';
  const needs = M ? needsList(M).length : 0;
  $('#tabs').innerHTML = TABS.map(([id, name]) => '<button class="tab" role="tab" type="button" data-tab="' + id + '" aria-selected="' + (id === tab) + '">' + name + (id === 'overview' && needs ? '<span class="badge">' + needs + '</span>' : '') + '</button>').join('');
  $('#demoWrap').innerHTML = DEMO ? '<div class="notice"><b>Preview mode.</b> Not connected to the shared Google Sheet yet, so changes stay on this device only. Try it: Unlock with PIN <b>1234</b> (volunteer) or <b>0000</b> (admin).</div>' : '';
}

function render(){
  if (!data) { $('#view').innerHTML = '<div class="empty-state">' + (loadError ? esc(loadError) : 'Loading the latest numbers…') + '</div>'; renderHeader(null); return; }
  const M = model();
  renderHeader(M);
  const v = { overview: vOverview, count: vCount, money: vMoney, cash: vCash, orders: vOrders, history: vHistory, activity: vActivity }[tab] || vOverview;
  $('#view').innerHTML = v(M);
  $('#view').insertAdjacentHTML('beforeend', '<div class="pride" aria-hidden="true"><span class="paw"></span><span class="paw"></span>Lion Country Pride<span class="paw"></span><span class="paw"></span></div>');
  if (tab === 'count') filterItems();
  renderSavebar();
}
const BL = '<span class="blank">·</span>';
function calcHTML(M, k){
  const [a, b, c] = k.split(':');
  if (a === 'it') { const i = M.items.find(x => String(x.id) === c); if (!i) return null;
    return { avail: count(i.avail), sold: i.counted === null ? BL : count(i.sold), rev: i.counted === null ? BL : money(i.rev), flag: flagPill(i.flag) }[b]; }
  if (a === 'T') return { onHand: count(M.T.onHand), received: count(M.T.received), avail: count(M.T.avail), sold: count(M.T.sold), rev: money(M.T.rev), profit: money(M.T.profit) }[b];
  if (a === 'm') return { in: money(M.totalIn), out: money(M.totalOut), net: money(M.net), shelf: money(M.shelf), real: money(M.real) }[b];
  if (a === 'cash') return { taken: M.cash.taken === null ? '<span class="blank">After closing</span>' : money(M.cash.taken), expected: money(M.cash.expected), cashapp: money(M.cash.cashapp), over: M.cash.over === null ? BL : money(M.cash.over) }[b];
  if (a === 'pu') { if (b === 'sum') return c === 'units' ? count(M.purchUnits) : money(M.purchTotal);
    const p = M.allP.find(x => String(x.id) === c); if (!p) return null; return { units: count(p.units), total: money(p.total), cpu: money(p.cpu) }[b]; }
  if (a === 'sh') { const s = M.sales.find(x => String(x.id) === c); if (!s) return null; const v = s[b]; return v === null ? BL : money(v); }
  return null;
}
function patchCalcs(){
  if (!data) return;
  const M = model();
  document.querySelectorAll('[data-calc]').forEach(el => { const h = calcHTML(M, el.dataset.calc); if (h !== null && h !== undefined && el.innerHTML !== h) el.innerHTML = h; });
  const o = document.querySelector('[data-calc="cash:over"]');
  if (o) o.className = M.cash.over === null ? '' : Math.abs(M.cash.over) < 10 ? 'good' : M.cash.over < 0 ? 'bad' : 'warn';
  renderHeader(M);
}
function filterItems(){ const q = query.trim().toLowerCase(); document.querySelectorAll('.item[data-name]').forEach(el => { el.hidden = !!q && !el.dataset.name.includes(q); }); }
function refreshCalcs(){
  // re-render everything except the input that has focus, so typing is never interrupted
  const a = document.activeElement, id = a && a.id, s = a && a.selectionStart;
  render();
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { if (s !== null && s !== undefined) el.setSelectionRange(s, s); } catch(e){} } }
}

  </section>
  <section>
    <div class="sec-h"><h2><span class="paw" aria-hidden="true"></span>Recent changes</h2><button class="btn small" type="button" data-tab="activity">See all</button></div>
    <div class="card">${log.length ? '<div class="log">' + log.map(logEntry).join('') + '</div>' : '<div class="empty-state">No changes yet. Every edit shows up here with who made it.</div>'}</div>
  </section>`;
}

function vCount(M){
  const q = query.trim().toLowerCase();
  const list = M.items.filter(i => catFilter === 'All' || i.category === catFilter);
  const counts = { All: M.items.length }; for (const c of CATS) counts[c] = M.items.filter(i => i.category === c).length;
  const after = phase === 'after';
  let body;
  if (showDetails && isAdmin()) {
    body = list.map(i => `<div class="item details" data-name="${esc(String(i.name).toLowerCase())}">

    </div>`).join('');
  } else {
    body = `<div class="item-head"><span>Item</span><span class="r">${after ? 'Available' : 'Received'}</span><span class="r">${after ? 'Sold' : 'Available'}</span><span>${after ? 'Counted after sale' : 'On hand before sale'}</span><span class="r">${after ? 'Sales' : 'Price'}</span></div>` +
      list.map(i => `<div class="item" data-name="${esc(String(i.name).toLowerCase())}">
      <div class="nm">${esc(i.name)} ${catPill(i.category)} <span data-calc="it:flag:${esc(i.id)}">${flagPill(i.flag)}</span><small>${money(i.price)} each${i.notes ? ' · ' + esc(i.notes) : ''}</small></div>
      ${after
        ? `<div class="cell res num"><span>Available</span><b data-calc="it:avail:${esc(i.id)}">${count(i.avail)}</b></div><div class="cell res num"><span>Sold</span><b data-calc="it:sold:${esc(i.id)}">${i.counted === null ? '<span class="blank">·</span>' : count(i.sold)}</b></div>`
        : `<div class="cell res num"><span>Received</span><b>${i.received ? '+' + count(i.received) : '<span class="blank">0</span>'}</b></div><div class="cell res num"><span>Available</span><b data-calc="it:avail:${esc(i.id)}">${count(i.avail)}</b></div>`}
      <div class="entry">${after ? field('items', i, 'countedAfter', { stepper:true, int:true, ph:'Count', label:'Counted after: ' + i.name }) : field('items', i, 'onHand', { stepper:true, int:true, ph:'0', label:'On hand before: ' + i.name })}</div>
      <div class="cell res num">${after ? `<span>Sales</span><b data-calc="it:rev:${esc(i.id)}">${i.counted === null ? '<span class="blank">·</span>' : money(i.rev)}</b>` : `<span>Price</span><b>${money(i.price)}</b>`}</div>
    </div>`).join('');
  }
  return `
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Which count">
      <button type="button" data-phase="before" aria-pressed="${!after}">Before the sale</button>
      <button type="button" data-phase="after" aria-pressed="${after}">After the sale</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Find an item" value="${esc(query)}" aria-label="Find an item">

function onEdit(el){
  const [t, id, f] = el.dataset.k.split('|');
  const a = addRow(t, id);
  if (a) { a.row[f] = el.value; }
  else {
    const srv = serverRow(t, id); if (!srv) return;
    const k = key(t, id, f);
    if (normVal(t, f, el.value, id) === normVal(t, f, srv[f], id)) delete pending.sets[k];
    else pending.sets[k] = { op:'set', table:t, id, field:f, prev: pending.sets[k] ? pending.sets[k].prev : (srv[f] ?? ''), value: el.value };
  }
  el.classList.toggle('dirty', !!a || !!pending.sets[key(t, id, f)]);
  el.classList.toggle('empty', el.value === '');
  clearTimeout(onEdit.tm); onEdit.tm = setTimeout(patchCalcs, 150);
  renderSavebar();
}
function newRow(t){

  const base = { items:{ name:'New item', category:'New', price:'', unitCost:'', onHand:'', countedAfter:'', notes:'' },

    moneyIn:{ date: iso, event:'', amount:'', notes:'' }, moneyOut:{ date: iso, order:'', amount:'', link:'', notes:'' } }[t];

/* ---------- server / preview backend ---------- */
async function apiLoad(){
  if (DEMO) {
    const d = store.get('css-demo-db', null) || JSON.parse(JSON.stringify(SEED));
    return { ok:true, data: { ...d, log: (d.log || []).slice(0, 80) } };
  }
  const r = await fetch(API_URL + '?action=load' + (viewCode ? '&code=' + encodeURIComponent(viewCode) : '') + '&t=' + Date.now());
  return r.json();
}
async function apiPost(body){
  if (DEMO) {
    const role = DEMO_PINS[body.pin];
    if (!role) return { ok:false, error:'That PIN did not work.' };
    if (body.action === 'auth') return { ok:true, role };
    const d = store.get('css-demo-db', null) || JSON.parse(JSON.stringify(SEED));
    const res = applyOps(d, body.ops, role, body.name || 'Someone', new Date().toISOString());
    d.log = res.log.reverse().concat(d.log || []).slice(0, 300);
    store.set('css-demo-db', d);
    return { ok:true, applied: res.applied, conflicts: res.conflicts, data: { ...d, log: d.log.slice(0, 80) } };
  }
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ ...body, code: viewCode }) });
  return r.json();
}
async function load(quiet){
  try {
    const res = await apiLoad();
    if (!res.ok && res.error === 'code') { loadError = ''; askCode(); return; }
    if (!res.ok) throw new Error(res.error || 'Could not load');
    data = res.data; lastSync = new Date(); loadError = '';
    const a = document.activeElement;
    if (quiet && a && a.dataset && a.dataset.k) { renderHeader(model()); return; }
    render();
  } catch (e) {
    loadError = 'Offline · showing last numbers';
    if (!data) loadError = 'Could not reach the tracker. Check the connection and refresh.';
    render();
  }
}
async function submit(){
  if (!auth) { openUnlock(); return; }
  const ops = Object.values(pending.sets).concat(pending.adds).concat(Object.values(pending.dels));
  if (!ops.length) return;
  const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await apiPost({ action:'save', pin: auth.pin, name: who, ops });
    if (!res.ok) { if (res.error && /PIN/.test(res.error)) { auth = null; store.sset('css-auth', null); } toast(res.error || 'Save failed. Your changes are still here.'); return; }
    data = res.data; lastSync = new Date();
    const held = (res.conflicts || []).filter(c => c.reason === 'changed' && c.op.op === 'set');
    pending = { sets:{}, adds:[], dels:{} };
    for (const c of held) pending.sets[key(c.op.table, c.op.id, c.op.field)] = { ...c.op, prev: c.current ?? '' };
    render();
    if (held.length) showConflicts(held);
    else if ((res.conflicts || []).length) toast('Saved ' + res.applied + '. ' + res.conflicts.length + ' could not be saved: ' + res.conflicts[0].reason + '.');
    else toast('Saved. Everyone sees it now.');
  } catch (e) { toast('Could not reach the tracker. Your changes are still here; try Submit again.'); }
  finally { btn.disabled = false; btn.textContent = 'Submit changes'; }
}

async function saveSaleDetails(vals){
  const ops = [];
  for (const [id, value] of Object.entries(vals)) {
    const r = serverRow('settings', id);
    if (r) { if (normVal('settings','value', r.value, id) !== normVal('settings','value', value, id)) ops.push({ op:'set', table:'settings', id, field:'value', prev: r.value ?? '', value }); }
    else if (value !== '') ops.push({ op:'add', table:'settings', row:{ id, value } });
  }
  // orders are tied to the sale's own row, so a rename never detaches them; older rows that carry the name get the row id
  const oldName = setting('eventName'), live = liveSale();
  if (live && vals.eventName && vals.eventName !== oldName) {
    for (const pr of (data.purchases || [])) if (pr.sale === oldName || blank(pr.sale)) ops.push({ op:'set', table:'purchases', id: pr.id, field:'sale', prev: pr.sale ?? '', value: live.id });
    for (const mo of (data.moneyOut || [])) if (mo.link === 'purchases' && mo.order === oldName + ' orders') ops.push({ op:'set', table:'moneyOut', id: mo.id, field:'order', prev: mo.order, value: vals.eventName + ' orders' });
    if (serverRow('sales', live.id) && live.theme !== vals.eventName) ops.push({ op:'set', table:'sales', id: live.id, field:'theme', prev: serverRow('sales', live.id).theme ?? '', value: vals.eventName });
  }
  if (!ops.length) { closeSheet(); return; }
  let res;
  try { res = await apiPost({ action:'save', pin: auth.pin, name: who, ops, atomic: true }); }
  catch (e) { $('#sErr').textContent = 'Could not reach the tracker. Nothing was changed. Try again.'; return; }
  if (!res.ok) { $('#sErr').textContent = res.error || 'Could not save.'; return; }
  if ((res.conflicts || []).length) { data = res.data; render(); $('#sErr').textContent = 'Someone else changed something at the same moment, so nothing was saved. Check the numbers and save again.'; return; }
  data = res.data; closeSheet(); render(); toast('Sale details saved. Everyone sees them now.');
}

function shrinkImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1800, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', 0.85); URL.revokeObjectURL(url);
      resolve({ media_type: 'image/jpeg', data: d.split(',')[1], preview: d });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
async function addImpFiles(files){
  const list = [...files].filter(f => /^image\//.test(f.type));
  for (const f of list) { if (impImgs.length >= 8) { $('#iErr').textContent = 'Up to 8 screenshots at a time.'; break; } try { impImgs.push(await shrinkImage(f)); } catch (e) { $('#iErr').textContent = 'One of those files could not be opened as a picture.'; } }
  const t = $('#thumbs'); if (t) t.innerHTML = impImgs.map((im, i) => `<figure><img src="${im.preview}" alt="Screenshot ${i+1}"><button type="button" data-imprm="${i}" aria-label="Remove screenshot">×</button></figure>`).join('');
}

async function saveImport(){
  const date = $('#impDate').value, store = $('#impStore').value.trim() || 'Amazon';
  const live = liveSale(); const sale = live ? live.id : setting('eventName');
  const existing = new Map(rows('items').map(i => [String(i.name).trim().toLowerCase(), String(i.name)]));
  const ops = [], newItems = new Map();
  const on = impLines.filter(l => l.on);
  if (!on.length) { $('#iErr').textContent = 'Check at least one line to save.'; return; }
  for (const l of on) {
    const packs = Number(l.packs), cost = Number(String(l.packCost).replace(/[$,]/g, '')), upp = Number(l.unitsPerPack);
    const label = l.target || l.newName || l.title;
    if (!(packs > 0) || !Number.isFinite(packs)) { $('#iErr').textContent = 'Packs needs a number for: ' + label; return; }
    if (!(cost >= 0) || String(l.packCost).trim() === '') { $('#iErr').textContent = 'Pack cost needs a number for: ' + label; return; }
    if (!(upp > 0)) { $('#iErr').textContent = 'Units per pack needs a number for: ' + label + '. Check the product title (24-pack = 24).'; return; }
    let name = l.target;
    if (!name) {
      const nn = String(l.newName || '').trim(); if (!nn) { $('#iErr').textContent = 'Give the new item a name.'; return; }

      if (hit) name = hit;
      else {
        const price = Number(String(l.price).replace(/[$,]/g, ''));
        if (String(l.price).trim() === '' || !(price >= 0)) { $('#iErr').textContent = 'Add a sell price for the new item: ' + nn; return; }
        if (!newItems.has(nn.toLowerCase())) newItems.set(nn.toLowerCase(), { name: nn, price });
        name = newItems.get(nn.toLowerCase()).name;
      }
    }
    ops.push({ op:'add', table:'purchases', row:{ id:'pu' + Date.now().toString(36) + Math.floor(Math.random()*1e6), date, store, item: name, packs, packCost: cost, unitsPerPack: upp, source:'Imported', sale, notes: '' } });
  }
  const itemOps = [...newItems.values()].map(n => ({ op:'add', table:'items', row:{ id:'it' + Date.now().toString(36) + Math.floor(Math.random()*1e6), name: n.name, category:'New', price: n.price, unitCost:'', onHand:'', countedAfter:'', notes:'' } }));
  const btn = $('#impSave'); btn.disabled = true; btn.textContent = 'Saving…';
  let res;
  try { res = await apiPost({ action:'save', pin: auth.pin, name: who, ops: itemOps.concat(ops), atomic: true }); }
  catch (e) { $('#iErr').textContent = 'Could not reach the tracker. Nothing was saved. Try again.'; btn.disabled = false; btn.textContent = 'Save order'; return; }
  if (!res.ok || (res.conflicts || []).length) { $('#iErr').textContent = (res.error || 'Nothing was saved because something changed at the same moment.') + ' Try Save again.'; if (res.data) data = res.data; btn.disabled = false; btn.textContent = 'Save order'; return; }
  data = res.data; closeSheet(); tab = 'orders'; render();
  toast('Imported ' + ops.length + ' order line' + (ops.length === 1 ? '' : 's') + (itemOps.length ? ' and ' + itemOps.length + ' new item' + (itemOps.length === 1 ? '' : 's') : '') + '.');
}

async function doCloseout(name, date){

  if (setting('eventName') === name) { closeSheet(); render(); toast(name + ' is already the current sale. Nothing changed.'); return; }
  const M = model(), ops = [];
  const set = (table, id, field, value) => { const r = serverRow(table, id); if (r && normVal(table, field, r[field], id) !== normVal(table, field, value, id)) ops.push({ op:'set', table, id, field, prev: r[field] ?? '', value }); };

    set('items', i.id, 'onHand', i.counted === null ? i.avail : i.counted);
    set('items', i.id, 'countedAfter', '');
    if (i.costFromOrders) set('items', i.id, 'unitCost', Math.round(i.unitCost * 10000) / 10000);
    if (i.category === 'New' || i.category === 'Restock') set('items', i.id, 'category', 'Carry-over');
  }
  for (const p of M.cur) if (M.liveId && String(p.sale) !== M.liveId) set('purchases', p.id, 'sale', M.liveId);
  for (const s of M.sales) if (s.live) { set('sales', s.id, 'spent', Math.round(M.purchTotal*100)/100); set('sales', s.id, 'sales', M.T.rev ? Math.round(M.T.rev*100)/100 : ''); set('sales', s.id, 'link', ''); }
  for (const r of M.mOut) if (r.link === 'purchases') { set('moneyOut', r.id, 'amount', Math.round(M.purchTotal*100)/100); set('moneyOut', r.id, 'link', ''); }
  set('cash', 'end', 'value', ''); set('cash', 'cashapp', 'value', ''); set('cash', 'countedBy', 'value', ''); set('cash', 'notes', 'value', '');
  set('settings', 'eventName', 'value', name); set('settings', 'eventDate', 'value', date); set('settings', 'announcement', 'value', '');
  const sid = Date.now().toString(36);
  ops.push({ op:'add', table:'sales', row:{ id:'sh' + sid, date, theme:name, spent:'', sales:'', other:'', what:'', link:'current' } });
  ops.push({ op:'add', table:'moneyIn', row:{ id:'mi' + sid + 'a', date, event: name + ' (cash deposit)', amount:'', notes:'Enter the deposit' } });
  ops.push({ op:'add', table:'moneyIn', row:{ id:'mi' + sid + 'b', date, event: name + ' (Cash App)', amount:'', notes:'Enter the Cash App total' } });
  ops.push({ op:'add', table:'moneyOut', row:{ id:'mo' + sid, date:'', order: name + ' orders', amount:'', link:'purchases', notes:'Fills in automatically from the Orders tab' } });

  try { res = await apiPost({ action:'save', pin: auth.pin, name: who, ops, atomic: true }); }
  catch (e) { $('#cErr').textContent = 'Could not reach the tracker. Reload the page before trying again, in case it went through.'; if (btn) { btn.disabled = false; btn.textContent = 'Close out and start'; } return; }
  if (!res.ok) { $('#cErr').textContent = res.error || 'Could not close out.'; if (btn) { btn.disabled = false; btn.textContent = 'Close out and start'; } return; }
  if ((res.conflicts || []).length) { data = res.data; render(); $('#cErr').textContent = 'Someone changed numbers at the same moment, so nothing was closed out. Check the counts and try again.'; if (btn) { btn.disabled = false; btn.textContent = 'Close out and start'; } return; }
  data = res.data; closeSheet(); tab = 'overview'; render();
  toast(name + ' is ready. Counts carried forward.');
}

    render(); toast('Undo is ready. Tap Submit to save it.'); return;
  }
  if (b.id === 'lockBtn') { if (auth) { if (pendingCount()) { toast('Submit or discard your changes before locking.'); return; } auth = null; store.sset('css-auth', null); showDetails = false; render(); toast('Locked. Viewing only.'); } else openUnlock(); return; }
  if (b.id === 'detailsBtn') { showDetails = !showDetails; return render(); }
  if (b.id === 'submitBtn') return submit();
  if (b.id === 'discardBtn') { pending = { sets:{}, adds:[], dels:{} }; render(); toast('Changes discarded.'); return; }
  if (b.id === 'keepTheirs') { pending = { sets:{}, adds:[], dels:{} }; closeSheet(); render(); return; }
  if (b.id === 'keepMine') { closeSheet(); submit(); return; }
  if (b.id === 'closeoutBtn') return openCloseout(model());
  if (b.id === 'saleEditBtn') return openSaleEdit();
  if (b.id === 'adminBtn') return openPins();
  if (b.id === 'importBtn') return openImport();
  if (b.id === 'impRead') return readImport();
  if (b.id === 'impBack') return openImport();
  if (b.id === 'impSave') return saveImport();
  if (b.dataset.imprm !== undefined) { impImgs.splice(+b.dataset.imprm, 1); addImpFiles([]); return; }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'unlockForm') {
    const name = $('#uName').value.trim(), pin = $('#uPin').value.trim();
    if (!name) { $('#uErr').textContent = 'Add your name so changes are labeled.'; return; }
    try {
      const res = await apiPost({ action:'auth', pin });
      if (!res.ok) { $('#uErr').textContent = res.error || 'That PIN did not work.'; return; }
      const draftBy = store.get('css-draft-who', '');
      if (pendingCount() && draftBy && draftBy !== name) { pending = { sets:{}, adds:[], dels:{} }; store.set('css-draft', pending); setTimeout(() => toast('Cleared unsaved changes left on this device by ' + draftBy + '.'), 4000); }
      auth = { role: res.role, pin }; who = name; store.sset('css-auth', auth); store.set('css-name', name);
      closeSheet(); render(); toast(res.role === 'admin' ? 'Unlocked with full access.' : 'Unlocked. You can enter counts, deposits and the cash box.');
    } catch (err) { $('#uErr').textContent = 'Could not reach the tracker. Check the connection.'; }
  }
  if (e.target.id === 'pinForm') { savePins(); return; }
  if (e.target.id === 'saleForm') { const n = $('#sName').value.trim(); if (!n) { $('#sErr').textContent = 'Give the sale a name.'; return; } const c = (document.querySelector('input[name=sColor]:checked') || {}).value || 'Pink'; saveSaleDetails({ eventName: n, eventDate: $('#sDate').value, eventColor: c, announcement: $('#sAnn').value.trim() }); return; }
  if (e.target.id === 'codeForm') { viewCode = $('#vCode').value.trim(); store.set('css-code', viewCode); closeSheet(); load(); }
  if (e.target.id === 'closeForm') { const n = $('#nName').value.trim(), d = $('#nDate').value; if (!n || !d) { $('#cErr').textContent = 'Add a name and date.'; return; } doCloseout(n, d); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.k && e.target.tagName === 'INPUT') {
    const all = [...document.querySelectorAll('input[data-k]')]; const i = all.indexOf(e.target); if (all[i+1]) { e.preventDefault(); all[i+1].focus(); all[i+1].select(); }
  }
});
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
window.addEventListener('beforeunload', e => { if (pendingCount()) { e.preventDefault(); e.returnValue = ''; } });

(function(){ const img = $('#logo'); if (!LOGO_URL) return; img.onload = () => { img.hidden = false; $('#paw').setAttribute('hidden',''); }; img.src = LOGO_URL; })();
load();
if (!DEMO) setInterval(() => { if (document.visibilityState === 'visible') load(true); }, 30000);
document.addEventListener('visibilitychange', () => { if (!DEMO && document.visibilityState === 'visible') load(true); });
</script>
